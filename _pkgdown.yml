# -------------------------------
# childpen pkgdown configuration
# -------------------------------

url: https://dorleventer.github.io/childpen

template:
  bootstrap: 5
  bootswatch: flatly

navbar:
  title: "childpen"
  structure:
    left: [intro, articles, reference, news]
    right: [github]
  components:
    articles:
      text: Articles
      menu:
        - text: "Notation and output"
          href: articles/notation.html
        - text: "Identification"
          href: articles/identification.html
        - text: "Estimation"
          href: articles/estimators.html
        - text: "Aggregation"
          href: articles/aggregation.html
        - text: "Replicating the paper"
          href: articles/replication.html
    github:
      icon: fa-github
      href: https://github.com/dorleventer/childpen
      aria-label: "GitHub repository"

home:
  title: "Identification of Child Penalties"
  description: >
    Estimators from Leventer, Identification of Child Penalties: within-gender
    DID, triple differences, the conventional normalized estimator with bias
    bounding, the effect of parenthood on the gender earnings ratio, accounting
    for the gender gap, and aggregation across treatment groups.
  links:
    - text: "Read the paper (arXiv)"
      href: "https://arxiv.org/abs/2602.07486"

articles:
  - title: "Articles"
    navbar: ~
    contents:
      - notation
      - identification
      - estimators
      - aggregation
      - articles/replication

reference:
  - title: "Estimation"
    contents:
      - multiple_treatment_group_analysis
      - single_treatment_group_analysis
      - aggregate_estimands
      - bias_bounds
  - title: "Simulated data"
    contents:
      - simulate_data
  - title: "Package"
    contents:
      - childpen-package

authors:
  Dor Leventer:
    href: https://sites.google.com/mail.tau.ac.il/dor-leventer/home

development:
  mode: auto

mathjax: true
