# -------------------------------
# childpen pkgdown configuration
# -------------------------------

url: https://dorleventer.github.io/childpen

template:
  bootstrap: 5
  bootswatch: flatly

navbar:
  title: "childpen"
  left:
    - text: "Home"
      href: index.html
    - text: "Articles"
      href: articles/index.html
  right:
    - icon: fa-github
      href: https://github.com/dorleventer/childpen
      aria-label: "GitHub repository"

home:
  title: "Identification of Child Penalties"
  description: >
    Tools for simulating child-penalty data and estimating
    DID, TD, and NTD frameworks—plus conditional and alternative
    identification approaches from Leventer (2025),
    *Identification of Child Penalties*.
  links:
    - text: "Read the paper (preprint)"
      href: "#"          # update with real link once public

articles:
  - title: "Guides"
    description: >
      The following vignettes show how to use the code in the package, as well as the main take-aways from the paper.
    contents:
      - simulation
      - NTD-identification
      - DID-estimation
      - validation_tests

authors:
  Dor Leventer:
    href: https://sites.google.com/mail.tau.ac.il/dor-leventer/home

development:
  mode: auto

mathjax: true
